<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- the blank: the rectangle the part is cut from, offset all round -->
  <rect x="5" y="13" width="54" height="38" rx="2" fill="#ffffff" stroke="#f5a623" stroke-width="3"/>
  <!-- the part itself, sitting at an angle inside its blank -->
  <g transform="rotate(-11 32 32)">
    <rect x="13" y="24" width="38" height="16" rx="1.5" fill="#4a90d9" stroke="#2c3e50" stroke-width="2.4"/>
  </g>
</svg>
